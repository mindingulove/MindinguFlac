name: Desktop Builds

on:
  push:
    tags:
      - "v*"
      - "build-v*"
  workflow_dispatch:
    inputs:
      target:
        description: Build target (windows, macos, all)
        required: true
        default: windows
        type: choice
        options:
          - windows
          - macos
          - all
      publish_release:
        description: Attach successful build ZIPs to an existing GitHub release
        required: false
        default: false
        type: boolean
      release_tag:
        description: Existing release tag to receive the ZIPs when publishing
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      target:
        description: Build target
        required: true
        default: windows
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release for pushed version tag
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME#build-}"
          notes_file="RELEASE_NOTES_${release_tag}.md"
          if [[ ! -f "$notes_file" ]]; then
            notes_file=""
          fi
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            if [[ -n "$notes_file" ]]; then
              gh release create "$release_tag" --title "$release_tag" --notes-file "$notes_file"
            else
              gh release create "$release_tag" --title "$release_tag" --generate-notes
            fi
          fi

  macos-arm64:
    name: macOS arm64
    needs: prepare-release
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'macos' || github.event.inputs.target == 'all') || github.event_name == 'workflow_call' && (github.event.inputs.target == 'macos' || github.event.inputs.target == 'all') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt
          python -m pip uninstall -y cffi
          ARCHFLAGS="-arch x86_64 -arch arm64" python -m pip install --no-binary cffi cffi
          python - <<'PY'
          import pathlib
          import cffi
          import _cffi_backend
          print("cffi", cffi.__version__, pathlib.Path(_cffi_backend.__file__))
          PY

      - name: Prepare icons
        run: python scripts/make_desktop_icons.py

      - name: Build macOS Now Playing helper
        run: bash scripts/build_macos_now_playing_helper.sh

      - name: Build app
        run: |
          brew install ffmpeg
          pyinstaller --noconfirm Mindinguflac.spec
          ditto -c -k --sequesterRsrc --keepParent dist/Mindinguflac.app Mindinguflac-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mindinguflac-macos-arm64
          path: Mindinguflac-macos-arm64.zip

      - name: Attach release asset
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          release_tag="${RELEASE_TAG#build-}"
          gh release upload "$release_tag" Mindinguflac-macos-arm64.zip --clobber

  macos-x86_64:
    name: macOS x86_64
    needs: prepare-release
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'macos' || github.event.inputs.target == 'all') || github.event_name == 'workflow_call' && (github.event.inputs.target == 'macos' || github.event.inputs.target == 'all') }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Prepare icons
        run: python scripts/make_desktop_icons.py

      - name: Build macOS Now Playing helper
        run: bash scripts/build_macos_now_playing_helper.sh

      - name: Build app
        run: |
          brew install ffmpeg
          pyinstaller --noconfirm Mindinguflac.spec
          ditto -c -k --sequesterRsrc --keepParent dist/Mindinguflac.app Mindinguflac-macos-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mindinguflac-macos-x86_64
          path: Mindinguflac-macos-x86_64.zip

      - name: Attach release asset
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          release_tag="${RELEASE_TAG#build-}"
          gh release upload "$release_tag" Mindinguflac-macos-x86_64.zip --clobber

  windows:
    name: Windows
    needs: prepare-release
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'windows' || github.event.inputs.target == 'all') || github.event_name == 'workflow_call' && (github.event.inputs.target == 'windows' || github.event.inputs.target == 'all') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Prepare icons
        run: python scripts/make_desktop_icons.py

      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Build app
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Mindinguflac-windows
          path: dist/Mindinguflac-windows.zip
          if-no-files-found: error

      - name: Attach release asset
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          $releaseTag = $env:RELEASE_TAG -replace '^build-', ''
          gh release upload $releaseTag dist/Mindinguflac-windows.zip --clobber
