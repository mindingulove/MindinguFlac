name: Desktop Builds

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  macos-universal:
    name: macOS universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt
          python -m pip uninstall -y cffi
          ARCHFLAGS="-arch x86_64 -arch arm64" python -m pip install --no-binary cffi cffi
          python - <<'PY'
          import pathlib
          import cffi
          import _cffi_backend
          print("cffi", cffi.__version__, pathlib.Path(_cffi_backend.__file__))
          PY

      - name: Prepare icons
        run: |
          python scripts/make_desktop_icons.py
          iconutil -c icns build/icons/mindinguflac.iconset -o build/icons/mindinguflac.icns

      - name: Build app
        run: |
          pyinstaller --noconfirm --windowed --name Mindinguflac \
            --icon build/icons/mindinguflac.icns \
            --add-data "static:static" \
            --collect-all SpotiFLAC \
            --target-arch universal2 \
            desktop.py
          ditto -c -k --sequesterRsrc --keepParent dist/Mindinguflac.app Mindinguflac-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mindinguflac-macos-universal
          path: Mindinguflac-macos-universal.zip

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Prepare icons
        run: python scripts/make_desktop_icons.py

      - name: Build app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Mindinguflac `
            --icon build/icons/mindinguflac.ico `
            --add-data "static;static" `
            --collect-all SpotiFLAC `
            desktop.py
          Compress-Archive -Path dist/Mindinguflac.exe -DestinationPath Mindinguflac-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mindinguflac-windows
          path: Mindinguflac-windows.zip
