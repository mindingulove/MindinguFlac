name: Desktop Builds

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      target:
        description: Build target
        required: true
        default: windows
        type: string

jobs:
  macos-arm64:
    name: macOS arm64
    if: ${{ github.event.inputs.target == 'macos' || github.event.inputs.target == 'all' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt
          python -m pip uninstall -y cffi
          ARCHFLAGS="-arch x86_64 -arch arm64" python -m pip install --no-binary cffi cffi
          python - <<'PY'
          import pathlib
          import cffi
          import _cffi_backend
          print("cffi", cffi.__version__, pathlib.Path(_cffi_backend.__file__))
          PY

      - name: Prepare icons
        run: python scripts/make_desktop_icons.py

      - name: Build macOS Now Playing helper
        run: bash scripts/build_macos_now_playing_helper.sh

      - name: Build app
        run: |
          brew install ffmpeg
          pyinstaller --noconfirm Mindinguflac.spec
          ditto -c -k --sequesterRsrc --keepParent dist/Mindinguflac.app Mindinguflac-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mindinguflac-macos-arm64
          path: Mindinguflac-macos-arm64.zip

  windows:
    name: Windows
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'windows' || github.event.inputs.target == 'all' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Prepare icons
        run: python scripts/make_desktop_icons.py

      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Build app
        shell: pwsh
        run: |
          pyinstaller --noconfirm Mindinguflac-windows.spec
          Compress-Archive -Path dist/Mindinguflac.exe -DestinationPath Mindinguflac-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mindinguflac-windows
          path: Mindinguflac-windows.zip
