name: Build Android security wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-wheels:
    name: Build patched Android arm64 wheels
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: chaquo/chaquopy
          ref: 75197ed5c8280c38881af0e03fede591f1abc11e
          path: .work/chaquopy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Android NDK and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf patch
          sdkmanager "ndk;27.3.13750724"

      - name: Prepare Chaquopy wheel builder
        working-directory: .work/chaquopy/server/pypi
        run: |
          python -m pip install build==1.5.0 jinja2==3.1.6 jsonschema==2.6.0 pyelftools==0.29 pypi-simple==1.1.0 pyyaml==6.0.3 setuptools==69.1.1 tqdm==4.66.1 wheel==0.33.6
          ../..//target/download-target.sh "$GITHUB_WORKSPACE/.work/chaquopy/maven/com/chaquo/python/target/3.12.12-0"
          mkdir -p dist/chaquopy-libffi dist/chaquopy-libjpeg dist/chaquopy-freetype
          curl --fail --location --silent --show-error \
            https://chaquo.com/pypi-13.1/chaquopy-libffi/chaquopy_libffi-3.3-3-py3-none-android_24_arm64_v8a.whl \
            --output dist/chaquopy-libffi/chaquopy_libffi-3.3-3-py3-none-android_24_arm64_v8a.whl
          curl --fail --location --silent --show-error \
            https://chaquo.com/pypi-13.1/chaquopy-libjpeg/chaquopy_libjpeg-1.5.3-1-py3-none-android_21_arm64_v8a.whl \
            --output dist/chaquopy-libjpeg/chaquopy_libjpeg-1.5.3-1-py3-none-android_21_arm64_v8a.whl
          curl --fail --location --silent --show-error \
            https://chaquo.com/pypi-13.1/chaquopy-freetype/chaquopy_freetype-2.9.1-2-py3-none-android_21_arm64_v8a.whl \
            --output dist/chaquopy-freetype/chaquopy_freetype-2.9.1-2-py3-none-android_21_arm64_v8a.whl
          mkdir -p custom-recipes "$RUNNER_TEMP/android-wheels"
          cp -R packages/cffi custom-recipes/cffi
          cp -R packages/pillow custom-recipes/pillow
          cp -R packages/cryptography custom-recipes/cryptography
          cat > custom-recipes/cryptography/patches/openssl_no_legacy.patch <<'PATCH'
          --- src-original/src/rust/src/lib.rs
          +++ src/src/rust/src/lib.rs
          @@ -89,2 +89,1 @@
          -    let load_legacy = !cfg!(CRYPTOGRAPHY_BUILD_OPENSSL_NO_LEGACY)
          -        && !env::var("CRYPTOGRAPHY_OPENSSL_NO_LEGACY").is_ok_and(|v| !v.is_empty() && v != "0");
          +    let load_legacy = false;
          PATCH
          cat > custom-recipes/cryptography/patches/pyo3_no_interpreter.patch <<'PATCH'
          --- src-original/Cargo.toml
          +++ src/Cargo.toml
          @@ -33,1 +33,1 @@
          -pyo3 = { version = "0.29", features = ["abi3", "abi3t"] }
          +pyo3 = { version = "0.29", features = ["abi3", "abi3t", "abi3-py312"] }
          PATCH
          sed -i 's/version: "1.17.1"/version: "2.0.0"/' custom-recipes/cffi/meta.yaml
          sed -i 's/version: "11.0.0"/version: "13.0.0"/' custom-recipes/pillow/meta.yaml
          sed -i 's/version: "42.0.8"/version: "50.0.2"/' custom-recipes/cryptography/meta.yaml
          sed -i 's/- openssl/- cffi 2.0.0/' custom-recipes/cryptography/meta.yaml
          python "$GITHUB_WORKSPACE/scripts/prepare_android_crypto_builder.py" .

      - name: Download verified prebuilt cffi 2.0.0 for Android
        working-directory: .work/chaquopy/server/pypi
        run: |
          mkdir -p dist/cffi
          curl --fail --location --silent --show-error \
            https://pypi.flet.dev/-/ver_19qZEZ/cffi-2.0.0-1-cp312-cp312-android_24_arm64_v8a.whl \
            --output dist/cffi/cffi-2.0.0-1-cp312-cp312-android_24_arm64_v8a.whl
          echo 'fd1f4eeb3217fe2aea9b8f027122d7e4baf11d227d9438f2a41828136a125f0a  dist/cffi/cffi-2.0.0-1-cp312-cp312-android_24_arm64_v8a.whl' | sha256sum --check
          cp dist/cffi/cffi-2.0.0-1-cp312-cp312-android_24_arm64_v8a.whl "$RUNNER_TEMP/android-wheels/"

      - name: Build Pillow 13.0.0 for Android
        working-directory: .work/chaquopy/server/pypi
        run: |
          python build-wheel.py --python 3.12 --abi arm64-v8a "custom-recipes/pillow"
          cp dist/pillow/pillow-13.0.0-*-cp312-cp312-android_24_arm64_v8a.whl "$RUNNER_TEMP/android-wheels/"

      - name: Install native CFFI for cryptography build helpers
        working-directory: .work/chaquopy/server/pypi
        run: python -m pip install --target env/lib/python cffi==2.0.0

      - name: Build patched OpenSSL 3.5 LTS for Android
        run: bash scripts/build_android_openssl.sh "$GITHUB_WORKSPACE/.work/chaquopy/server/pypi/openssl-static"

      - name: Build cryptography 50.0.2 for Android
        working-directory: .work/chaquopy/server/pypi
        run: |
          export MINDINGUFLAC_OPENSSL_DIR="$PWD/openssl-static/prefix"
          python build-wheel.py --python 3.12 --abi arm64-v8a "custom-recipes/cryptography"
          cp dist/cryptography/cryptography-50.0.2-*-cp312-cp312-android_24_arm64_v8a.whl "$RUNNER_TEMP/android-wheels/"

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-security-wheels
          path: ${{ runner.temp }}/android-wheels/*.whl
          if-no-files-found: error
